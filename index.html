<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de Gestión de Departamentos - PWA">
    <meta name="theme-color" content="#6366f1">
    <title>Departamentos PWA - Inicio</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
</head>
<body>
    <div id="landing-page" class="page active">
        <header class="hero-header">
            <div class="hero-content">
                <div class="logo-container">
                    <svg class="main-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <rect x="10" y="20" width="80" height="60" rx="5" fill="#6366f1"/>
                        <rect x="20" y="30" width="25" height="20" rx="2" fill="#ffffff"/>
                        <rect x="55" y="30" width="25" height="20" rx="2" fill="#ffffff"/>
                        <rect x="20" y="60" width="25" height="20" rx="2" fill="#ffffff"/>
                        <rect x="55" y="60" width="25" height="20" rx="2" fill="#ffffff"/>
                        <circle cx="50" cy="10" r="8" fill="#fbbf24"/>
                    </svg>
                </div>
                <h1 class="hero-title">Sistema de Gestión de Departamentos</h1>
                <p class="hero-subtitle">Administra tus departamentos de forma eficiente y sin conexión</p>
                <div class="hero-features">
                    <div class="feature-item">
                        <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                        </svg>
                        <span>Funciona Offline</span>
                    </div>
                    <div class="feature-item">
                        <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                        </svg>
                        <span>Gestión Completa</span>
                    </div>
                    <div class="feature-item">
                        <svg class="feature-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        </svg>
                        <span>Seguro y Confiable</span>
                    </div>
                </div>
                <button class="btn-primary" onclick="showLogin()">Iniciar Sesión</button>
            </div>
        </header>
    </div>

    <div id="login-page" class="page">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <svg class="login-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <rect x="10" y="20" width="80" height="60" rx="5" fill="#6366f1"/>
                        <rect x="20" y="30" width="25" height="20" rx="2" fill="#ffffff"/>
                        <rect x="55" y="30" width="25" height="20" rx="2" fill="#ffffff"/>
                        <rect x="20" y="60" width="25" height="20" rx="2" fill="#ffffff"/>
                        <rect x="55" y="60" width="25" height="20" rx="2" fill="#ffffff"/>
                    </svg>
                    <h2>Iniciar Sesión</h2>
                </div>
                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="username">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                            Usuario
                        </label>
                        <input type="text" id="username" name="username" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="password">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            Contraseña
                        </label>
                        <input type="password" id="password" name="password" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn-primary btn-block">Ingresar</button>
                </form>
                <div class="login-footer">
                    <button class="btn-link" onclick="showLanding()">Volver al inicio</button>
                </div>
            </div>
        </div>
    </div>

    <div id="departamentos-page" class="page">
        <header class="app-header">
            <div class="header-content">
                <h1>
                    <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    Gestión de Departamentos
                </h1>
                <div class="header-actions">
                    <span class="user-info" id="user-display"></span>
                    <button class="btn-icon" onclick="logout()" title="Cerrar Sesión">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" y1="12" x2="9" y2="12"/>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="toolbar">
                <button class="btn-primary" onclick="openDepartamentoModal()">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Nuevo Departamento
                </button>
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input type="text" id="search-input" placeholder="Buscar departamentos..." oninput="filterDepartamentos()">
                </div>
            </div>

            <div class="table-container">
                <table id="departamentos-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Dirección</th>
                            <th>Número</th>
                            <th>Descripción</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="departamentos-tbody">
                        <!-- Los departamentos se cargarán aquí -->
                    </tbody>
                </table>
                <div id="empty-state" class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    <p>No hay departamentos registrados</p>
                    <button class="btn-primary" onclick="openDepartamentoModal()">Crear Primer Departamento</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal para Crear/Editar Departamento -->
    <div id="departamento-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Nuevo Departamento</h2>
                <button class="btn-icon" onclick="closeDepartamentoModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <form id="departamento-form" onsubmit="saveDepartamento(event)">
                <input type="hidden" id="departamento-id">
                <div class="form-group">
                    <label for="direccion">Dirección *</label>
                    <input type="text" id="direccion" required>
                </div>
                <div class="form-group">
                    <label for="numero">Número *</label>
                    <input type="number" id="numero" required>
                </div>
                <div class="form-group">
                    <label for="descripcion">Descripción *</label>
                    <textarea id="descripcion" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label for="estado">Estado *</label>
                    <select id="estado" required>
                        <option value="">Seleccione un estado</option>
                        <option value="Disponible">Disponible</option>
                        <option value="Ocupado">Ocupado</option>
                        <option value="Mantenimiento">Mantenimiento</option>
                        <option value="Reservado">Reservado</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeDepartamentoModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
